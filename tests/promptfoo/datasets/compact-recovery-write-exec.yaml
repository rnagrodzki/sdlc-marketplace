# Script execution tests for the compact-recovery WRITERS (Task 7, R74 — #505).
#
# `stop-state-save.js` and `pre-compact-save.js` used to write
# `.compact-recovery-<branchSlug>.json` on EVERY Stop / PreCompact that found
# any ship or execute state, stamping `savedAt: Date.now()` unconditionally.
# Because `savedAt` was refreshed on every write, session-start.js's 1h TTL
# gate never expired — a long-dead pipeline kept injecting recovery context
# into unrelated sessions. Both writers now:
#   (a) parse stdin for `session_id` and gate the write on the same
#       `hookEnforcementAllowed(data, payload)` predicate (lib/state.js) the
#       three enforcement hooks already use (R73, #505) — a denied session
#       SKIPS the write entirely (no "denied" marker; an absent file is
#       already the correct signal to session-start.js), and any existing
#       recovery file is left byte-for-byte untouched;
#   (b) source `savedAt` from the winning state file's own filesystem mtime,
#       not `Date.now()`, so a genuinely quiet pipeline actually ages out.
#
# Run via the hook-runner provider (returns {stdout, stderr, exitCode} JSON).
# Neither writer ever prints to stdout, so tests that need to observe the
# filesystem side effect (was the sidecar written? left untouched?) drive the
# hook via `node -e` (script_path: "-e"), spawning the real hook as a child
# process and reporting the resulting file state as JSON on the wrapper's own
# stdout — mirrors the `hookEnforcementAllowed`/`claimSession` cases in
# ship-hooks-exec.yaml. `script_args` is passed through hook-runner's
# `.split(/\s+/)`, so every `-e` body below is a single whitespace-free
# expression (no `const`/`let`, no bare spaces even inside string literals;
# multi-param arrow functions and comma-sequencing instead of block
# statements) — do not reformat these onto multiple lines or add spaces.
#
# Fixtures (all prefixed `compact-recovery-` per task isolation):
#   compact-recovery-ship-match             — ship state, sessionId sess-fixture, fresh mtime
#   compact-recovery-ship-ancient           — same, mtime backdated to 2024 (isolates mtime-vs-Date.now())
#   compact-recovery-ship-mismatch-existing — ship state sessionId sess-fixture + pre-seeded sentinel sidecar
#   compact-recovery-ship-session-absent    — ship state with NO sessionId key (pre-#505 state file)
#   compact-recovery-execute-fallback       — no ship state, execute state only

# ---------------------------------------------------------------------------
# stop-state-save.js
# ---------------------------------------------------------------------------

# 1. Matching session -> sidecar IS written; payload keys are the expected
#    ship-sdlc shape; savedAt equals the state file's own (fresh) mtime.
- description: "compact-recovery (R74): sidecar is written when hookEnforcementAllowed is true"
  vars:
    script_path: "-e"
    script_args: '((cp,fs,rp,sp)=>console.log(JSON.stringify({status:cp.spawnSync("node",["{{repo_root}}/plugins/sdlc-utilities/hooks/stop-state-save.js"],{input:JSON.stringify({session_id:"sess-fixture"}),cwd:process.cwd(),encoding:"utf8"}).status,exists:fs.existsSync(rp),recovery:fs.existsSync(rp)?JSON.parse(fs.readFileSync(rp,"utf8")):null,stateMtimeMs:fs.statSync(sp).mtimeMs})))(require("child_process"),require("fs"),process.cwd()+"/.sdlc/execution/.compact-recovery-feat-compact-recovery-match.json",process.cwd()+"/.sdlc/execution/ship-feat-compact-recovery-match-20260608T120000Z.json")'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/compact-recovery-ship-match"
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output);
        if (r.exitCode !== 0) return `FAIL: exit ${r.exitCode} stderr=${r.stderr}`;
        const inner = JSON.parse(r.stdout);
        if (inner.status !== 0) return `FAIL: hook exited ${inner.status}`;
        if (inner.exists !== true) return 'FAIL: recovery sidecar was not written';
        if (!inner.recovery) return 'FAIL: recovery sidecar missing/unparseable';
        if (inner.recovery.pipeline !== 'ship-sdlc') return `FAIL: pipeline=${inner.recovery.pipeline}`;
        if (inner.recovery.currentStep !== 'commit') return `FAIL: currentStep=${inner.recovery.currentStep}`;
        if (inner.recovery.branch !== 'feat/compact-recovery-match') return `FAIL: branch=${inner.recovery.branch}`;
        const savedAtMs = new Date(inner.recovery.savedAt).getTime();
        if (Math.abs(savedAtMs - inner.stateMtimeMs) > 1000) return `FAIL: savedAt=${inner.recovery.savedAt} does not match state mtime=${inner.stateMtimeMs}`;
        return true;

# 2. Matching session, but the state file's mtime is backdated to 2024 ->
#    savedAt must reflect that OLD mtime, not the "now" of the hook run.
#    Isolates the core defect: before the fix, savedAt was Date.now() and
#    would land far from stateMtimeMs (and would never be older than 2025).
- description: "compact-recovery (R74): savedAt equals the state file's own mtime"
  vars:
    script_path: "-e"
    script_args: '((cp,fs,rp,sp)=>console.log(JSON.stringify({status:cp.spawnSync("node",["{{repo_root}}/plugins/sdlc-utilities/hooks/stop-state-save.js"],{input:JSON.stringify({session_id:"sess-fixture"}),cwd:process.cwd(),encoding:"utf8"}).status,exists:fs.existsSync(rp),recovery:fs.existsSync(rp)?JSON.parse(fs.readFileSync(rp,"utf8")):null,stateMtimeMs:fs.statSync(sp).mtimeMs})))(require("child_process"),require("fs"),process.cwd()+"/.sdlc/execution/.compact-recovery-feat-compact-recovery-ancient.json",process.cwd()+"/.sdlc/execution/ship-feat-compact-recovery-ancient-20260608T120000Z.json")'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/compact-recovery-ship-ancient"
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output);
        if (r.exitCode !== 0) return `FAIL: exit ${r.exitCode} stderr=${r.stderr}`;
        const inner = JSON.parse(r.stdout);
        if (inner.status !== 0) return `FAIL: hook exited ${inner.status}`;
        if (inner.exists !== true) return 'FAIL: recovery sidecar was not written';
        if (!inner.recovery) return 'FAIL: recovery sidecar missing/unparseable';
        const savedAtMs = new Date(inner.recovery.savedAt).getTime();
        if (Math.abs(savedAtMs - inner.stateMtimeMs) > 1000) return `FAIL: savedAt=${inner.recovery.savedAt} does not match backdated state mtime=${inner.stateMtimeMs}`;
        if (savedAtMs > Date.parse('2025-01-01T00:00:00Z')) return `FAIL: savedAt=${inner.recovery.savedAt} looks like Date.now(), not the 2024 mtime`;
        return true;

# 3. Mismatched session -> sidecar is NOT written; a pre-existing sidecar is
#    left byte-for-byte untouched (no "denied" marker overwrite).
- description: "compact-recovery (R74): sidecar is NOT written when hookEnforcementAllowed is false"
  vars:
    script_path: "-e"
    script_args: '((cp,fs,rp)=>console.log(JSON.stringify({status:cp.spawnSync("node",["{{repo_root}}/plugins/sdlc-utilities/hooks/stop-state-save.js"],{input:JSON.stringify({session_id:"sess-other"}),cwd:process.cwd(),encoding:"utf8"}).status,content:fs.readFileSync(rp,"utf8")})))(require("child_process"),require("fs"),process.cwd()+"/.sdlc/execution/.compact-recovery-feat-compact-recovery-mismatch.json")'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/compact-recovery-ship-mismatch-existing"
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output);
        if (r.exitCode !== 0) return `FAIL: exit ${r.exitCode} stderr=${r.stderr}`;
        const inner = JSON.parse(r.stdout);
        if (inner.status !== 0) return `FAIL: hook exited ${inner.status}`;
        if (inner.content.trim() !== '{"sentinel":"untouched-by-denied-write","savedAt":"2020-01-01T00:00:00.000Z"}') return `FAIL: existing sidecar was modified: ${inner.content}`;
        return true;

# 4. State file carries no sessionId (pre-#505 state) -> denies, no sidecar
#    is created even though the hook's own payload DOES carry a session_id.
- description: "stop-state-save (R74): state without sessionId denies the write (fail-open to no-op)"
  vars:
    script_path: "-e"
    script_args: '((cp,fs,rp)=>console.log(JSON.stringify({status:cp.spawnSync("node",["{{repo_root}}/plugins/sdlc-utilities/hooks/stop-state-save.js"],{input:JSON.stringify({session_id:"sess-any"}),cwd:process.cwd(),encoding:"utf8"}).status,exists:fs.existsSync(rp)})))(require("child_process"),require("fs"),process.cwd()+"/.sdlc/execution/.compact-recovery-feat-compact-recovery-absent.json")'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/compact-recovery-ship-session-absent"
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output);
        if (r.exitCode !== 0) return `FAIL: exit ${r.exitCode} stderr=${r.stderr}`;
        const inner = JSON.parse(r.stdout);
        if (inner.status !== 0) return `FAIL: hook exited ${inner.status}`;
        if (inner.exists !== false) return 'FAIL: recovery sidecar was written for a session-less state file';
        return true;

