# ---------------------------------------------------------------------------
# session-start.js — end-to-end proof that the writer fix actually lets the
# consumer's 1h TTL gate expire (this is the whole point of R74: savedAt used
# to be refreshed on every Stop, so the gate NEVER expired). We deliberately
# do not edit session-start.js (owned by Task 6) — these tests only INVOKE it
# read-only, chained after the real writer hook, inside one wrapper process.
# ---------------------------------------------------------------------------

# 9. Positive control: a FRESH sidecar (mtime ~= now) still resumes within the
#    TTL gate — proves the negative case below is not vacuously true.
- description: "session-start (R74 consumer proof): a fresh recovery sidecar still resumes within the 1h TTL gate"
  vars:
    script_path: "-e"
    script_args: '((cp)=>((w,rd)=>console.log(JSON.stringify({writeStatus:w.status,writeStderr:w.stderr,readStatus:rd.status,readStdout:rd.stdout})))(cp.spawnSync("node",["{{repo_root}}/plugins/sdlc-utilities/hooks/stop-state-save.js"],{input:JSON.stringify({session_id:"sess-fixture"}),cwd:process.cwd(),encoding:"utf8"}),cp.spawnSync("node",["{{repo_root}}/plugins/sdlc-utilities/hooks/session-start.js"],{input:JSON.stringify({hook_event_name:"SessionStart",source:"startup"}),cwd:process.cwd(),encoding:"utf8"})))(require("child_process"))'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/compact-recovery-ship-match"
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output);
        if (r.exitCode !== 0) return `FAIL: exit ${r.exitCode} stderr=${r.stderr}`;
        const inner = JSON.parse(r.stdout);
        if (inner.writeStatus !== 0) return `FAIL: stop-state-save exited ${inner.writeStatus} stderr=${inner.writeStderr}`;
        if (inner.readStatus !== 0) return `FAIL: session-start exited ${inner.readStatus}`;
        if (!/Pipeline state recovered after compaction/.test(inner.readStdout)) return `FAIL: fresh recovery was not injected, stdout=${inner.readStdout}`;
        if (!/ship-sdlc on feat\/compact-recovery-match/.test(inner.readStdout)) return `FAIL: missing pipeline/branch line, stdout=${inner.readStdout}`;
        return true;

# 10. The fix itself: a STALE pipeline (state mtime backdated to 2024) writes
#     a sidecar whose savedAt reflects that age, so session-start.js's 1h TTL
#     gate now actually expires it instead of re-injecting it forever.
- description: "session-start (R74 consumer proof): a genuinely stale pipeline's recovery sidecar now ages out of the 1h TTL gate"
  vars:
    script_path: "-e"
    script_args: '((cp)=>((w,rd)=>console.log(JSON.stringify({writeStatus:w.status,writeStderr:w.stderr,readStatus:rd.status,readStdout:rd.stdout})))(cp.spawnSync("node",["{{repo_root}}/plugins/sdlc-utilities/hooks/stop-state-save.js"],{input:JSON.stringify({session_id:"sess-fixture"}),cwd:process.cwd(),encoding:"utf8"}),cp.spawnSync("node",["{{repo_root}}/plugins/sdlc-utilities/hooks/session-start.js"],{input:JSON.stringify({hook_event_name:"SessionStart",source:"startup"}),cwd:process.cwd(),encoding:"utf8"})))(require("child_process"))'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/compact-recovery-ship-ancient"
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output);
        if (r.exitCode !== 0) return `FAIL: exit ${r.exitCode} stderr=${r.stderr}`;
        const inner = JSON.parse(r.stdout);
        if (inner.writeStatus !== 0) return `FAIL: stop-state-save exited ${inner.writeStatus} stderr=${inner.writeStderr}`;
        if (inner.readStatus !== 0) return `FAIL: session-start exited ${inner.readStatus}`;
        if (/Pipeline state recovered after compaction/.test(inner.readStdout)) return `FAIL: stale (2024) recovery was still injected -- TTL gate did not expire it, stdout=${inner.readStdout}`;
        return true;
