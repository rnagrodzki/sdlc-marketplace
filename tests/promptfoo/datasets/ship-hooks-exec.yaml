# 16. RECLAIMED — state created by session A, the real claimSession() applied for
#     session B, then the hook invoked as B. Proves a legitimately resumed run
#     keeps its nudges instead of being silenced by the creating session's id.
#     `script_args` is the ONLY var that substitutes {{repo_root}}, so the claim
#     and the hook spawn both happen inside a single whitespace-free `-e`
#     expression (hook-runner splits script_args on /\s+/).
- description: "pipeline-continue (R73, #505): reclaimed pipeline still nudges the resuming session"
  vars:
    script_path: "-e"
    script_args: '((cp,st,hook)=>console.log(JSON.stringify({claimed:st.claimSession("ship","feat-ship"),hook:cp.spawnSync("node",[hook],{input:JSON.stringify({tool_name:"Bash",tool_response:{},session_id:"sess-B"}),cwd:process.cwd(),encoding:"utf8"})})))(require("child_process"),require("{{repo_root}}/plugins/sdlc-utilities/scripts/lib/state.js"),"{{repo_root}}/plugins/sdlc-utilities/hooks/pipeline-continue.js")'
    script_cwd: "{{project_root}}"
    script_env: '{"CLAUDE_CODE_SESSION_ID":"sess-B"}'
    project_root: "file://fixtures-fs/ship-pipeline-session-reclaimed"
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output);
        if (r.exitCode !== 0) return `FAIL: exit ${r.exitCode} stderr=${r.stderr}`;
        const inner = JSON.parse(r.stdout);
        if (inner.claimed !== true) return 'FAIL: claimSession did not rewrite the state file';
        if (inner.hook.status !== 0) return `FAIL: hook exited ${inner.hook.status}`;
        const emitted = JSON.parse(inner.hook.stdout);
        if (!/in_progress/.test((emitted.hookSpecificOutput || {}).additionalContext || '')) return `FAIL: no nudge after reclaim, stderr=${inner.hook.stderr}`;
        return true;

