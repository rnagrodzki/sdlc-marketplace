# 7. Consecutive-block cap (Task 6, #505 follow-up) — bounds the hook's own
#    documented idempotence: repeated invocations against the SAME unchanged
#    advancing state block forever unless capped. RECONCILES the prior
#    "idempotent block on repeated invocation" case: the hook is invoked
#    STOP_BLOCK_CAP+1 (4) times in sequence against the same unchanged
#    in_progress step, sharing the same sidecar-bearing state dir across
#    spawns (unlike every other case in this file, which spawns the hook
#    exactly once). The first 3 invocations still block; the 4th degrades to
#    silent exit 0 with a stderr diagnostic — stdout stays the JSON decision
#    channel and never carries the cap-breach note.
- description: "stop-pipeline-continue (Task 6, #505): consecutive-block cap silences after 3 unchanged blocks"
  vars:
    script_path: "-e"
    script_args: '((cp,hook)=>console.log(JSON.stringify(Array(4).fill(0).map(_=>cp.spawnSync("node",[hook],{input:JSON.stringify({stop_hook_active:false,session_id:"sess-fixture"}),cwd:process.cwd(),encoding:"utf8"})).map(r=>({status:r.status,stdout:r.stdout,stderr:r.stderr})))))(require("child_process"),"{{repo_root}}/plugins/sdlc-utilities/hooks/stop-pipeline-continue.js")'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/ship-pipeline-inprogress"
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output);
        if (r.exitCode !== 0) return `FAIL: exit ${r.exitCode} stderr=${r.stderr}`;
        const runs = JSON.parse(r.stdout);
        if (!Array.isArray(runs) || runs.length !== 4) return `FAIL: expected 4 runs, got: ${r.stdout}`;
        for (let i = 0; i < 3; i++) {
          if (runs[i].status !== 0) return `FAIL: run ${i} exit ${runs[i].status}`;
          const decision = JSON.parse(runs[i].stdout);
          if (decision.decision !== 'block') return `FAIL: run ${i} decision ${decision.decision}`;
        }
        if (runs[3].status !== 0) return `FAIL: run 3 (cap breach) exit ${runs[3].status}`;
        if (runs[3].stdout.trim() !== '') return `FAIL: run 3 expected silent stdout, got: ${runs[3].stdout}`;
        if (!/cap/i.test(runs[3].stderr)) return `FAIL: run 3 missing cap diagnostic on stderr: ${runs[3].stderr}`;
        return true;

# 7b. The cap resets when the pipeline advances to a different step (Task 6,
#     #505 follow-up): the same 4-run sequence as above reaches the cap on
#     step "execute" (sidecar count 3), the ship state file is then rewritten
#     so step "commit" is in_progress instead, and a 5th invocation blocks
#     again — the stepName mismatch against the sidecar's recorded step
#     resets count to 0 rather than staying silenced by the prior step's cap.
- description: "stop-pipeline-continue (Task 6, #505): consecutive-block counter resets on step change"
  vars:
    script_path: "-e"
    script_args: '((cp,fs,hook,statePath)=>((r1,r2,r3,r4)=>(fs.writeFileSync(statePath,JSON.stringify({version:1,startedAt:"2026-06-08T12:00:00Z",branch:"feat/ship",sessionId:"sess-fixture",flags:{auto:true,steps:["execute","commit","pr"]},steps:[{name:"execute",status:"completed"},{name:"commit",status:"in_progress"},{name:"pr",status:"pending"}]})),((r5)=>console.log(JSON.stringify([r1,r2,r3,r4,r5].map(r=>({status:r.status,stdout:r.stdout,stderr:r.stderr})))))(cp.spawnSync("node",[hook],{input:JSON.stringify({stop_hook_active:false,session_id:"sess-fixture"}),cwd:process.cwd(),encoding:"utf8"}))))(cp.spawnSync("node",[hook],{input:JSON.stringify({stop_hook_active:false,session_id:"sess-fixture"}),cwd:process.cwd(),encoding:"utf8"}),cp.spawnSync("node",[hook],{input:JSON.stringify({stop_hook_active:false,session_id:"sess-fixture"}),cwd:process.cwd(),encoding:"utf8"}),cp.spawnSync("node",[hook],{input:JSON.stringify({stop_hook_active:false,session_id:"sess-fixture"}),cwd:process.cwd(),encoding:"utf8"}),cp.spawnSync("node",[hook],{input:JSON.stringify({stop_hook_active:false,session_id:"sess-fixture"}),cwd:process.cwd(),encoding:"utf8"})))(require("child_process"),require("fs"),"{{repo_root}}/plugins/sdlc-utilities/hooks/stop-pipeline-continue.js",process.cwd()+"/.sdlc/execution/ship-feat-ship-20260608T120000Z.json")'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/ship-pipeline-inprogress"
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output);
        if (r.exitCode !== 0) return `FAIL: exit ${r.exitCode} stderr=${r.stderr}`;
        const runs = JSON.parse(r.stdout);
        if (!Array.isArray(runs) || runs.length !== 5) return `FAIL: expected 5 runs, got: ${r.stdout}`;
        for (let i = 0; i < 3; i++) {
          const decision = JSON.parse(runs[i].stdout);
          if (decision.decision !== 'block') return `FAIL: run ${i} (step execute) decision ${decision.decision}`;
        }
        if (runs[3].stdout.trim() !== '') return `FAIL: run 3 (cap breach on execute) expected silent stdout, got: ${runs[3].stdout}`;
        const afterReset = JSON.parse(runs[4].stdout);
        if (afterReset.decision !== 'block') return `FAIL: run 4 (step commit, post-reset) expected block, got: ${runs[4].stdout}, stderr=${runs[4].stderr}`;
        if (!/commit/.test(afterReset.reason || '')) return 'FAIL: post-reset block reason missing new step name "commit"';
        return true;

