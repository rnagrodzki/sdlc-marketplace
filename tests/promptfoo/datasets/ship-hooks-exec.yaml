# ---------------------------------------------------------------------------
# hookEnforcementAllowed / claimSession (R73, #505) — session-identity gate.
#
# hookEnforcementAllowed(data, payload) is pure (no I/O), so the four
# predicate cases invoke it directly via `node -e` — no fixture needed.
# `script_args` is passed through hook-runner's `.split(/\s+/)`, so each
# `-e` body below is a single whitespace-free expression (no `const`/`let`,
# multi-param arrow functions instead of block statements).
#
# The reclaim-on-resume cases drive the real skill/ship.js binary (not the
# library directly) against the existing project-ship-state-resume fixture,
# to prove claimSession() is actually wired into both resume branches there
# — not just that the library function works in isolation. The `-e` script
# stamps the fixture's state file with sessionId "sess-A", spawns ship.js
# with CLAUDE_CODE_SESSION_ID set to a different session, then reads the
# file back and reports {status, before, after} — all inside the spawned
# node process itself (which has normal require/fs access; only inline
# promptfoo assertions are sandboxed and cannot use require/fs).
# ---------------------------------------------------------------------------

# 1. Matching session ids → allowed:true, regardless of payload.cwd (a linked
#    task worktree's cwd must not affect the decision — no worktree term).
- description: "hookEnforcementAllowed (R73, #505): matching session ids allows enforcement (payload.cwd ignored)"
  vars:
    script_path: "-e"
    script_args: 'console.log(JSON.stringify(require("{{repo_root}}/plugins/sdlc-utilities/scripts/lib/state.js").hookEnforcementAllowed({sessionId:"sess-A"},{session_id:"sess-A",cwd:"/some/other/worktree"})))'
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output);
        if (r.exitCode !== 0) return `FAIL: exit ${r.exitCode} stderr=${r.stderr}`;
        const inner = JSON.parse(r.stdout);
        if (inner.allowed !== true) return `FAIL: allowed=${inner.allowed} reason=${inner.reason}`;
        return true;

# 2. Session ids differ → allowed:false, SILENT (no enforcement, no throw).
- description: "hookEnforcementAllowed (R73, #505): mismatched session ids denies enforcement"
  vars:
    script_path: "-e"
    script_args: 'console.log(JSON.stringify(require("{{repo_root}}/plugins/sdlc-utilities/scripts/lib/state.js").hookEnforcementAllowed({sessionId:"sess-A"},{session_id:"sess-B"})))'
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output);
        if (r.exitCode !== 0) return `FAIL: exit ${r.exitCode} stderr=${r.stderr}`;
        const inner = JSON.parse(r.stdout);
        if (inner.allowed !== false) return `FAIL: allowed=${inner.allowed}`;
        if (!/mismatch/.test(inner.reason || '')) return `FAIL: reason=${inner.reason}`;
        return true;

# 3. State carries no sessionId (pre-#505 state file, or absent/null) → denies.
- description: "hookEnforcementAllowed (R73, #505): state sessionId absent denies enforcement"
  vars:
    script_path: "-e"
    script_args: 'console.log(JSON.stringify(require("{{repo_root}}/plugins/sdlc-utilities/scripts/lib/state.js").hookEnforcementAllowed({},{session_id:"sess-A"})))'
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output);
        if (r.exitCode !== 0) return `FAIL: exit ${r.exitCode} stderr=${r.stderr}`;
        const inner = JSON.parse(r.stdout);
        if (inner.allowed !== false) return `FAIL: allowed=${inner.allowed}`;
        if (!/absent/.test(inner.reason || '')) return `FAIL: reason=${inner.reason}`;
        return true;

# 4. Hook payload carries no session_id (e.g. an older Claude Code build) → denies.
- description: "hookEnforcementAllowed (R73, #505): payload session_id absent denies enforcement"
  vars:
    script_path: "-e"
    script_args: 'console.log(JSON.stringify(require("{{repo_root}}/plugins/sdlc-utilities/scripts/lib/state.js").hookEnforcementAllowed({sessionId:"sess-A"},{})))'
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output);
        if (r.exitCode !== 0) return `FAIL: exit ${r.exitCode} stderr=${r.stderr}`;
        const inner = JSON.parse(r.stdout);
        if (inner.allowed !== false) return `FAIL: allowed=${inner.allowed}`;
        if (!/absent/.test(inner.reason || '')) return `FAIL: reason=${inner.reason}`;
        return true;

# 5. Reclaim on IMPLICIT resume (R-implicit-resume, #359): a fresh state file
#    stamped for session A, ship.js invoked with no --resume flag under
#    session B (implicitResume auto-fires since fresh && !cli.resume) — the
#    on-disk sessionId must flip to B.
#    "fresh" here comes only from the fs.writeFileSync() call happening
#    milliseconds before the ship.js spawn in the same expression below —
#    resume.fresh is an mtime check, and nothing else in this case touches
#    the file's mtime. Do not reorder or split the write out from the spawn
#    (e.g. into a separate script_args or an earlier setup step): doing so
#    lets the mtime age past the freshness window, implicitResume never
#    fires, claimSession() is never called, and this case fails on the
#    `after !== 'sess-B'` assertion below for a reason unrelated to
#    claimSession itself (a maintenance trap, not a correctness one).
- description: "claimSession (R73, #505): implicit resume reclaims sessionId for the resuming session"
  vars:
    script_path: "-e"
    script_args: '((fs,cp,fp,shipJs)=>(fs.writeFileSync(fp,JSON.stringify({version:1,startedAt:"2026-01-01T00:00:00Z",branch:"main",flags:{auto:true,steps:["commit"]},steps:[{name:"commit",status:"pending"}],decisions:[],deferredFindings:[],sessionId:"sess-A"})),console.log(JSON.stringify({status:cp.spawnSync("node",[shipJs,"--steps","commit"],{cwd:process.cwd(),env:Object.assign({},process.env,{CLAUDE_CODE_SESSION_ID:"sess-B"}),encoding:"utf8"}).status,before:"sess-A",after:JSON.parse(fs.readFileSync(fp,"utf8")).sessionId}))))(require("fs"),require("child_process"),process.cwd()+"/.sdlc/execution/ship-main-20260101T000000Z.json","{{repo_root}}/plugins/sdlc-utilities/scripts/skill/ship.js")'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-state-resume"
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output);
        if (r.exitCode !== 0) return `FAIL: exit ${r.exitCode} stderr=${r.stderr}`;
        const inner = JSON.parse(r.stdout);
        if (inner.status !== 0) return `FAIL: ship.js exited ${inner.status}, no claim could happen`;
        if (inner.before !== 'sess-A') return `FAIL: precondition not met, before=${inner.before}`;
        if (inner.after !== 'sess-B') return `FAIL: sessionId not reclaimed, after=${inner.after}`;
        return true;

