# Validator-regression tests for the script-resolution-version rule.
# #485 replaced runtime `find`-based script resolution with hook-injected plugin
# paths, so the cases that exercised runtime resolution were removed; only the
# consistency-validator regression coverage remains here.

# Validator regression (#485): the script-resolution-version rule in
# .claude/skills/validate-plugin-consistency/check-consistency.js must flag
# any plugin-script resolver that uses `find ~/.claude/plugins`.
- description: "script-resolution: validator flags 'find ~/.claude/plugins' resolver form"
  vars:
    script_path: "repo://.claude/skills/validate-plugin-consistency/check-consistency.js"
    script_args: "--project-root {{project_root}} --json"
    project_root: "file://fixtures-fs/resolution-validator-cases/bad-project"
  assert:
    # The new rule must fire on the bad fixture
    - type: icontains
      value: '"rule": "script-resolution-version"'
    - type: icontains
      value: 'find ~/.claude/plugins'

- description: "script-resolution: validator passes 'sort -V | tail -1' (good case)"
  vars:
    script_path: "repo://.claude/skills/validate-plugin-consistency/check-consistency.js"
    script_args: "--project-root {{project_root}} --json"
    project_root: "file://fixtures-fs/resolution-validator-cases/good-project"
  assert:
    # The good fixture must NOT trigger the new rule
    - type: not-icontains
      value: '"rule": "script-resolution-version"'
