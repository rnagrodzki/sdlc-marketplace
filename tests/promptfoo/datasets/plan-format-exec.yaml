# --- PF10: template-driven required section presence (Task 5) ---
# PF10 only runs under --final AND when --template is given; the default template path resolves
# via {{repo_root}} to plugins/sdlc-utilities/skills/plan-sdlc/plan-template-default.md.

- description: "plan-format: PF10 fails when plan is missing ## Context (default template)"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/ci/validate-plan-format.js"
    script_args: "--project-root {{project_root}} --file {{project_root}}/plans/test-plan.md --final --template {{repo_root}}/plugins/sdlc-utilities/skills/plan-sdlc/plan-template-default.md --json"
    project_root: "file://fixtures-fs/project-valid-plan"
  assert:
    - type: icontains
      value: '"passed": false'
    - type: regex
      value: '"id":\s*"PF10",\s*"status":\s*"fail"'
    - type: icontains
      value: "Missing required section(s)"
    - type: icontains
      value: "Context"

- description: "plan-format: PF10 fails when plan is missing ## Final Shape (default template)"
  vars:
