# --- detectActiveChanges diff-fallback + syncIncompleteTasks tests (Task 5) ---
# Fixture: git repo whose current branch (feat/issue-42-rework) does NOT match
# the active change's slug (my-change), forcing detectActiveChanges past the
# branch-slug regex and into the committed-diff fallback. tasks.md ships with
# 1 done + 2 pending tasks for syncIncompleteTasks coverage.

- description: "openspec-lib: detectActiveChanges resolves branchMatch via diff fallback when branch name does not match change slug"
  vars:
    script_path: "repo://tests/promptfoo/scripts/openspec-lib-test.js"
    script_args: "--op detectActiveChanges --project-root {{project_root}}"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-openspec-detect-diff"
  assert:
    - type: icontains
      value: '"present":true'
    - type: icontains
      value: '"branchMatch":"my-change"'

- description: "openspec-lib: syncIncompleteTasks marks all pending tasks done"
  vars:
    script_path: "repo://tests/promptfoo/scripts/openspec-lib-test.js"
    script_args: "--op syncIncompleteTasks --project-root {{project_root}} --change my-change"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-openspec-detect-diff"
  assert:
    - type: icontains
      value: '"synced":2'
    - type: icontains
      value: '"alreadyDone":0'
    - type: icontains
      value: '"failed":[]'

- description: "openspec-lib: syncIncompleteTasks is idempotent — a second call finds nothing left to sync"
  vars:
    script_path: "repo://tests/promptfoo/scripts/openspec-lib-test.js"
    script_args: "--op syncIncompleteTasksTwice --project-root {{project_root}} --change my-change"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-openspec-detect-diff"
  assert:
    - type: icontains
      value: '"first":{"synced":2,"alreadyDone":0,"failed":[]}'
    - type: icontains
      value: '"second":{"synced":0,"alreadyDone":0,"failed":[]}'

- description: "openspec-lib: syncIncompleteTasks is exported"
  vars:
    script_path: "repo://tests/promptfoo/scripts/openspec-lib-test.js"
    script_args: "--op exports"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-openspec-baseline"
  assert:
    - type: icontains
      value: '"hasSyncIncompleteTasks": true'
